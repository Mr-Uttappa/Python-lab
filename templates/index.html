<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Shopping Store</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; margin: 0; }
    header { background: #333; color: white; padding: 15px; text-align: center; }
    .products { display: flex; flex-wrap: wrap; justify-content: center; margin: 20px; }
    .card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            margin: 15px; width: 220px; text-align: center; padding: 15px; }
    .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; }
    .card h3 { margin: 10px 0; }
    .card button { background: #28a745; color: white; border: none; padding: 10px;
                   border-radius: 5px; cursor: pointer; }
    .card button:hover { background: #218838; }
  </style>
</head>
<body>
  <header>
    <h1>🛍️ My Shopping Store</h1>
  </header>

  <section class="products">
    {% for product in products %}
    <div class="card">
      <img src="{{ product.image }}" alt="{{ product.name }}">
      <h3>{{ product.name }}</h3>
      <p>{{ product.price }}</p>
      <button>Add to Cart</button>
    </div>
    {% endfor %}
  </section>
</body>
</html>
